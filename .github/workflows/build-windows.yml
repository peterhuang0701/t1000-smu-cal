name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller pyvisa pyvisa-py pyserial pillow

      - name: Get version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build exe
        run: pyinstaller --clean SMU_Cal_Tool.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMU_Cal_Tool-v${{ steps.ver.outputs.version }}
          path: dist/SMU_Cal_Tool.exe
          retention-days: 90

      - name: Rename exe with version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cp dist/SMU_Cal_Tool.exe "dist/SMU_Cal_Tool-v${{ steps.ver.outputs.version }}.exe"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SMU_Cal_Tool-v${{ steps.ver.outputs.version }}.exe
          generate_release_notes: true
